<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#F6F1E9" />
  <meta
    name="description"
    content="민준과 서연의 결혼식에 초대합니다. 둘이 걷던 길, 이제 함께 걸어요."
  />

  <!-- 실제 이름으로 변경하세요. -->
  <title>민준 ♥ 서연 — 우리의 이야기</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 영문 라벨(eyebrow)용 서체. 제목 서체 Griun Cherry 1 Spoon은 라이선스 확인 후 @font-face로 등록하세요. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap"
    rel="stylesheet"
  />

  <style>
    /* 색은 역할 토큰으로만 씁니다. 라이트 값은 mocha/rose/champagne/sage/eucalyptus 램프, 다크 값은 dark-* 램프입니다. */
    :root {
      color-scheme: light;

      --bg-basement: #e0d7ca;
      --bg-default: #f6f1e9;
      --bg-floating: #fffdf9;
      --bg-fill: #ede6db;
      --bg-brand-solid: #9a6168;
      --bg-brand-solid-pressed: #7a4f51;
      --bg-brand-weak: #f3dfdd;
      --bg-accent-weak: #f8eddb;

      --fg-neutral: #2d211a;
      --fg-neutral-muted: #5c4c41;
      --fg-neutral-subtle: #76675a;
      --fg-neutral-inverted: #fffdf9;
      --fg-brand: #7a4f51;

      --stroke-neutral-subtle: #ede6db;
      --stroke-focus-ring: #6b726c;

      --deco-champagne: #e7cb9b;
      --deco-sage: #9a9d5c;
      --deco-sage-leaf: #807d4b;

      --font-title: "Griun Cherry 1 Spoon", "Apple SD Gothic Neo", sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      --font-eyebrow: "Cormorant Garamond", "Noto Serif KR", Georgia, serif;

      font-family: var(--font-body);
      color: var(--fg-neutral);
      background: var(--bg-basement);

      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;

        --bg-basement: #2f251e;
        --bg-default: #1a1410;
        --bg-floating: #120d0a;
        --bg-fill: #221a15;
        --bg-brand-solid: #d8a5aa;
        --bg-brand-solid-pressed: #e1b8bb;
        --bg-brand-weak: #38231e;
        --bg-accent-weak: #3b291f;

        --fg-neutral: #f4eee5;
        --fg-neutral-muted: #d6cbbe;
        --fg-neutral-subtle: #b3a596;
        --fg-neutral-inverted: #120d0a;
        --fg-brand: #e1b8bb;

        --stroke-neutral-subtle: #221a15;
        --stroke-focus-ring: #a4afaa;

        --deco-champagne: #8c7559;
        --deco-sage: #a9ab74;
        --deco-sage-leaf: #b8ba8c;
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;

      --bg-basement: #2f251e;
      --bg-default: #1a1410;
      --bg-floating: #120d0a;
      --bg-fill: #221a15;
      --bg-brand-solid: #d8a5aa;
      --bg-brand-solid-pressed: #e1b8bb;
      --bg-brand-weak: #38231e;
      --bg-accent-weak: #3b291f;

      --fg-neutral: #f4eee5;
      --fg-neutral-muted: #d6cbbe;
      --fg-neutral-subtle: #b3a596;
      --fg-neutral-inverted: #120d0a;
      --fg-brand: #e1b8bb;

      --stroke-neutral-subtle: #221a15;
      --stroke-focus-ring: #a4afaa;

      --deco-champagne: #8c7559;
      --deco-sage: #a9ab74;
      --deco-sage-leaf: #b8ba8c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg-basement);
    }

    h1,
    p {
      margin: 0;
    }

    /* 콘텐츠 폭은 최대 430px, 바깥은 bg-layer-basement */
    .invitation {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-height: 100svh;
      margin: 0 auto;
      padding: 56px 16px 40px;
      padding-top: calc(56px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      overflow: hidden;
      text-align: center;
      background: var(--bg-default);
    }

    /* 섹션은 한 가지 이야기만 담고, 섹션 사이는 x20(80px)을 비웁니다. */
    .section {
      position: relative;
      animation: rise 600ms cubic-bezier(0.03, 0.4, 0.1, 1) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 작은 손그림 잎사귀 장식 */
    .botanical {
      position: relative;
      width: 75px;
      height: 27px;
      margin: 0 auto;
    }

    .leaf {
      position: absolute;
      display: block;
      width: 8px;
      height: 14px;
      border-radius: 70% 30% 65% 35%;
      background: var(--deco-sage);
    }

    .leaf:nth-child(1) {
      left: 4px;
      top: 12px;
      transform: rotate(-55deg);
    }

    .leaf:nth-child(2) {
      left: 17px;
      top: 7px;
      transform: rotate(-30deg);
    }

    .leaf:nth-child(3) {
      left: 29px;
      top: 0;
      transform: rotate(-12deg);
    }

    .leaf:nth-child(4) {
      right: 18px;
      top: 5px;
      transform: rotate(20deg);
    }

    .leaf:nth-child(5) {
      right: 3px;
      top: 14px;
      transform: rotate(44deg);
    }

    /* 영문 라벨: 섹션 위에 한 줄만 */
    .eyebrow {
      margin-top: 8px;
      font-family: var(--font-eyebrow);
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--fg-neutral-subtle);
    }

    .greeting {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 500;
      line-height: 20px;
      color: var(--fg-neutral-muted);
    }

    /* display-hero 48/60 — 한 화면에 한 번만 */
    .title {
      margin-top: 12px;
      font-family: var(--font-title);
      font-size: 48px;
      font-weight: 400;
      line-height: 60px;
      word-break: keep-all;
    }

    .couple {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 20px;
      margin-top: 24px;
    }

    .partner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .role {
      font-size: 13px;
      font-weight: 500;
      line-height: 20px;
      color: var(--fg-neutral-subtle);
    }

    /* display-heading 24/32 */
    .name {
      font-family: var(--font-title);
      font-size: 24px;
      font-weight: 400;
      line-height: 32px;
    }

    /* 가는 선 하트(♡) */
    .heart {
      font-size: 20px;
      line-height: 1;
      color: var(--fg-brand);
    }

    /* 아치 액자: 상단 두 모서리 full, 아래는 직각 */
    .frame {
      position: relative;
      width: 280px;
      height: 320px;
      margin: 24px auto 0;
    }

    .frame-photo {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 999px 999px 0 0;
      background: var(--bg-brand-weak);
      object-fit: cover;
      object-position: center 60%;
    }

    /* 샴페인 원과 세이지 알약은 사진 가장자리에 걸치고 글자와 겹치지 않습니다. */
    .deco {
      position: absolute;
      display: block;
      pointer-events: none;
    }

    .deco-circle {
      top: 20px;
      right: -22px;
      width: 72px;
      height: 72px;
      border-radius: 999px;
      background: var(--deco-champagne);
      opacity: 0.85;
    }

    .deco-pill {
      bottom: 36px;
      left: -18px;
      width: 60px;
      height: 22px;
      border-radius: 999px;
      background: var(--deco-sage);
    }

    .message {
      margin-top: 24px;
      font-size: 15px;
      line-height: 28px;
      color: var(--fg-neutral);
      word-break: keep-all;
    }

    /* ActionButton large 52px, primary, pill */
    .start-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 52px;
      margin-top: 24px;
      padding: 0 20px;

      border: 0;
      border-radius: 999px;
      background: var(--bg-brand-solid);
      color: var(--fg-neutral-inverted);
      box-shadow: 0 1px 4px 0 rgb(74 45 30 / 10%);

      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 500;
      line-height: 22px;
      cursor: pointer;
      transition: background-color 150ms cubic-bezier(0.35, 0, 0.35, 1),
        transform 150ms cubic-bezier(0.35, 0, 0.35, 1);
    }

    .start-button:active {
      background: var(--bg-brand-solid-pressed);
    }

    .start-button:focus-visible {
      outline: 2px solid var(--stroke-focus-ring);
      outline-offset: 3px;
    }

    .arrow {
      font-size: 20px;
      line-height: 1;
    }

    .closing {
      margin-top: 12px;
      font-size: 12px;
      line-height: 16px;
      color: var(--fg-neutral-subtle);
    }

    /* 라이트 모드에서만 누를 때 살짝 줄어듭니다. */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) .start-button:active {
        transform: scale(0.97);
      }
    }

    @media (max-width: 350px) {
      .invitation {
        padding-right: 16px;
        padding-left: 16px;
      }

      .title {
        font-size: 36px;
        line-height: 44px;
      }

      .couple {
        gap: 16px;
      }

      .frame {
        width: 240px;
        height: 280px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .section {
        animation: none;
      }

      .start-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="invitation" aria-labelledby="invitation-title">
    <header class="section">
      <div class="botanical" aria-hidden="true">
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
      </div>

      <p class="eyebrow">Wedding Invitation</p>

      <p class="greeting">소중한 당신을 초대합니다</p>

      <h1 class="title" id="invitation-title">
        우리, 함께<br />
        모험을 시작해요
      </h1>
    </header>

    <!-- 실제 이름으로 변경하세요. -->
    <section class="section couple" aria-label="신랑과 신부">

        <span class="role">신랑</span>
        <span class="name">민준</span>
      </p>

      <span class="heart" aria-label="그리고">♡</span>

      <p class="partner">
        <span class="role">신부</span>
        <span class="name">서연</span>
      </p>
    </section>
