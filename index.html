<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#f8f4e9" />
  <meta
    name="description"
    content="민준과 서연의 결혼식에 초대합니다. 둘이 걷던 길, 이제 함께 걸어요."
  />

  <!-- 실제 이름으로 변경하세요. -->
  <title>민준 ♥ 서연 — 우리의 이야기</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      color-scheme: light;

      --ivory: #f8f4e9;
      --brown: #675246;
      --sage: #657b65;
      --rose: #b98680;
      --muted: #968574;
      --outer: #ece7de;

      font-family: "Gowun Dodum", sans-serif;
      color: var(--brown);
      background: var(--outer);

      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    h1,
    p {
      margin: 0;
    }

    .invitation {
      width: 100%;
      max-width: 390px;
      min-height: 844px;
      min-height: max(844px, 100svh);
      margin: 0 auto;
      padding-top: calc(34px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(33px + env(safe-area-inset-bottom, 0px));
      overflow: hidden;
      text-align: center;
      background: var(--ivory);
    }

    .heading {
      padding: 0 28px;
    }

    /* 작은 손그림 잎사귀 장식 */
    .botanical {
      position: relative;
      width: 75px;
      height: 27px;
      margin: 0 auto;
    }

    .leaf {
      position: absolute;
      display: block;
      width: 8px;
      height: 14px;
      border-radius: 70% 30% 65% 35%;
      background: var(--sage);
    }

    .leaf:nth-child(1) {
      left: 4px;
      top: 12px;
      transform: rotate(-55deg);
    }

    .leaf:nth-child(2) {
      left: 17px;
      top: 7px;
      transform: rotate(-30deg);
    }

    .leaf:nth-child(3) {
      left: 29px;
      top: 0;
      transform: rotate(-12deg);
    }

    .leaf:nth-child(4) {
      right: 18px;
      top: 5px;
      transform: rotate(20deg);
    }

    .leaf:nth-child(5) {
      right: 3px;
      top: 14px;
      transform: rotate(44deg);
    }

    .greeting {
      margin-top: 16px;
      font-size: 13px;
      line-height: 19px;
    }

    .title {
      margin-top: 16px;
      font-family: "Jua", sans-serif;
      font-size: 36px;
      font-weight: 400;
      line-height: 44px;
      word-break: keep-all;
    }

    .couple {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 34px;
      margin-top: 35px;
    }

    .partner {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .role {
      color: var(--muted);
      font-size: 12px;
      line-height: 17px;
    }

    .name {
      font-family: "Jua", sans-serif;
      font-size: 27px;
      line-height: 34px;
    }

    .heart {
      color: var(--rose);
      font-size: 21px;
      line-height: 1;
    }

    .illustration {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 390 / 381;
      margin-top: 15px;
      object-fit: contain;
    }

    .start {
      margin-top: 11px;
      padding: 0 28px;
    }

    .message {
      font-size: 14px;
      line-height: 20px;
      word-break: keep-all;
    }

    .start-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 60px;
      margin-top: 19px;
      padding: 14px 18px;

      border: 0;
      border-radius: 17px;
      background: var(--sage);
      color: var(--ivory);

      font-family: "Jua", sans-serif;
      font-size: 20px;
      line-height: 25px;
    }

    .start-button:focus-visible {
      outline: 3px solid var(--brown);
      outline-offset: 4px;
    }

    .arrow {
      font-family: sans-serif;
      font-size: 27px;
      font-weight: 400;
      line-height: 1;
    }

    .closing {
      margin-top: 19px;
      color: var(--muted);
      font-size: 12px;
      line-height: 17px;
    }

    @media (max-width: 350px) {
      .heading,
      .start {
        padding-right: 22px;
        padding-left: 22px;
      }

      .title {
        font-size: 32px;
        line-height: 40px;
      }

      .couple {
        gap: 16px;
      }

      .start-button {
        font-size: 18px;
      }
    }

    @media (min-width: 600px) {
      body {
        padding: 32px 0;
      }

      .invitation {
        min-height: 844px;
        border-radius: 24px;
        box-shadow: 0 12px 50px rgb(103 82 70 / 8%);
      }
    }
  </style>
</head>

<body>
  <main class="invitation" aria-labelledby="invitation-title">
    <header class="heading">
      <div class="botanical" aria-hidden="true">
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
        <span class="leaf"></span>
      </div>

      <p class="greeting">소중한 당신을 초대합니다</p>

      <h1 class="title" id="invitation-title">
        우리, 함께<br />
        모험을 시작해요
      </h1>
    </header>

    <!-- 실제 이름으로 변경하세요. -->
    <div class="couple">
      <p class="partner">
        <span class="role">신랑</span>
        <span class="name">민준</span>
      </p>

      <span class="heart" aria-label="그리고">♥</span>

      <p class="partner">
        <span class="role">신부</span>
        <span class="name">서연</span>
      </p>
    </div>

    <!-- Figma에서 내보낸 그림을 couple.png로 함께 올려주세요. -->
    <img
      class="illustration"
      src="./couple.png"
      alt="잔잔한 바다와 작은 마을 앞에 나란히 선 손그림 신랑과 신부"
      width="390"
      height="381"
      fetchpriority="high"
    />

    <footer class="start">
      <p class="message">
        둘이 걷던 길, 이제 함께 걸어요.
      </p>

      <!-- 현재는 첫 화면만 구현되어 다음 화면 연결은 없습니다. -->
      <button class="start-button" type="button">
        <span>우리의 이야기 시작하기</span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>

      <p class="closing">
        저희의 첫걸음에 함께해 주세요
      </p>
    </footer>
  </main>
</body>
</html>
