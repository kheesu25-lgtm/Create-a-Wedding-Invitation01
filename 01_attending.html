<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Forever | 참석 완료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap">
<style>
  /* Our Forever 디자인 토큰 (역할 토큰) */
  :root {
    --bg-layer-basement: #E0D7CA;
    --bg-layer-default: #F6F1E9;
    --bg-layer-floating: #FFFDF9;
    --bg-brand-solid: #9a6168;
    --bg-brand-solid-pressed: #7a4f51;
    --bg-brand-weak: #f3dfdd;
    --bg-accent-weak: #f8eddb;
    --bg-neutral-solid: #2D211A;
    --fg-neutral: #4A3A30;
    --fg-neutral-subtle: #76675A;
    --fg-neutral-inverted: #FFFDF9;
    --fg-brand: #9a6168;
    --stroke-neutral-muted: #E0D7CA;
    --stroke-brand-solid: #9a6168;
    --stroke-focus-ring: #6b726c;
    --shadow-s3: 0px 4px 16px 0px rgba(74, 45, 30, 0.16);
    --font-display: "Griun Cherry 1 Spoon", "Apple SD Gothic Neo", sans-serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    --font-eyebrow: "Cormorant Garamond", "Noto Serif KR", Georgia, serif;
    --ease: cubic-bezier(0.35, 0, 0.35, 1);
    --ease-enter-expressive: cubic-bezier(0.03, 0.4, 0.1, 1);
  }
  /* 서체 파일이 준비되면 경로를 맞춰 주세요.
  @font-face { font-family: "Griun Cherry 1 Spoon"; src: url("fonts/Griun_Cherry1Spoon-Rg.ttf") format("truetype"); font-display: swap; }
  */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-layer-basement);
    color: var(--fg-neutral);
    font-family: var(--font-sans);
  }
  button, a { font: inherit; }

  .page { max-width: 430px; margin: 0 auto; }
  .layout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start; }
  .preview { min-width: 0; }
  .caption { text-align: center; font-size: 13px; color: var(--fg-neutral-subtle); margin: 16px 0 0; }

  /* 화면 */
  .screen {
    position: relative; width: 100%; max-width: 390px; min-height: 844px; margin: 0 auto;
    background: var(--bg-layer-default); padding: 12px;
  }
  .card {
    min-height: 820px; border-radius: 28px; background: var(--bg-layer-floating);
    padding: 36px 20px 26px; display: flex; flex-direction: column; align-items: center; text-align: center;
    animation: rise 600ms var(--ease-enter-expressive) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .eyebrow {
    margin: 0; font-family: var(--font-eyebrow); font-size: 11px; line-height: 16px; font-weight: 500;
    letter-spacing: 3px; text-transform: uppercase; color: var(--fg-brand);
  }

  .arch { position: relative; width: 100%; max-width: 314px; margin-top: 16px; }
  .arch svg { display: block; width: 100%; height: auto; }
  .seal {
    position: absolute; left: 50%; bottom: -27px; transform: translateX(-50%);
    width: 36px; height: 36px; border-radius: 9999px; background: var(--bg-layer-floating);
    border: 1px solid var(--stroke-neutral-muted); display: grid; place-items: center; color: var(--fg-brand);
  }

  .title { margin: 10px 0 0; font-family: var(--font-display); font-size: 27px; line-height: 36px; font-weight: 400; color: var(--fg-neutral); }
  .lead { margin: 8px 0 0; font-size: 14px; line-height: 24px; color: var(--fg-neutral-subtle); }
  .status { margin-top: 44px; }

  .rule { width: 220px; max-width: 70%; height: 1px; border: 0; background: var(--stroke-neutral-muted); margin: 52px 0 0; }
  .not-attending .rule { margin-top: 28px; }

  .date-card {
    width: 270px; max-width: 100%; height: 64px; margin-top: 20px; border-radius: 14px; background: var(--bg-accent-weak);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .date-card .eyebrow { letter-spacing: 1.8px; line-height: 14px; color: var(--fg-neutral-subtle); }
  .date-card time { font-family: var(--font-display); font-size: 19px; line-height: 24px; color: var(--fg-neutral); }
  .note { margin: 8px 0 0; font-size: 13px; line-height: 20px; color: var(--fg-neutral-subtle); }

  .actions { width: 100%; max-width: 326px; margin-top: 12px; display: grid; gap: 12px; }
  .not-attending .actions { margin-top: 40px; }
  .btn {
    height: 48px; width: 100%; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; line-height: 19px; font-weight: 500; text-decoration: none; cursor: pointer;
    transition: background-color 150ms var(--ease), transform 150ms var(--ease);
  }
  .btn:focus-visible { outline: 2px solid var(--stroke-focus-ring); outline-offset: 2px; }
  .btn-primary { border: 0; background: var(--bg-brand-solid); color: var(--fg-neutral-inverted); }
  .btn-primary:active { background: var(--bg-brand-solid-pressed); transform: scale(0.97); }
  .btn-outline { border: 1.2px solid var(--stroke-brand-solid); background: var(--bg-layer-floating); color: var(--fg-brand); }
  .btn-outline:active { background: var(--bg-brand-weak); transform: scale(0.97); }

  .footer { margin-top: auto; padding-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .footer .eyebrow { font-size: 9px; line-height: 12px; letter-spacing: 2.5px; color: var(--fg-neutral-subtle); }

  /* 스낵바 */
  .snackbar {
    position: fixed; left: 50%; bottom: 56px; z-index: 10; width: calc(100% - 32px); max-width: 358px;
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px;
    background: var(--bg-neutral-solid); color: var(--fg-neutral-inverted); box-shadow: var(--shadow-s3);
    font-size: 14px; line-height: 19px; transition: opacity 300ms var(--ease), transform 300ms var(--ease);
  }
  .snackbar.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 760px) {
    .page { padding: 0 0 40px; }
    .layout { grid-template-columns: 1fr; gap: 0; }
    .caption { margin: 8px 0 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .btn, .snackbar { transition: none; }
    .btn:active { transform: none; }
  }
</style>
</head>
<body>

            <button type="button" class="btn btn-outline" data-message="캘린더에 12월 12일 일정을 추가했어요.">캘린더에 일정 추가</button>

</main>

<div class="snackbar" id="snackbar" role="status" aria-live="polite">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  <span id="snackbar-text"></span>
</div>

<script>
  // 버튼 동작 자리: 실제 지도·캘린더·첫 화면 링크로 바꿔 연결하세요.
  const snackbar = document.getElementById('snackbar');
  const snackText = document.getElementById('snackbar-text');
  let timer;
  document.querySelectorAll('[data-message]').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (el.getAttribute('href') === '#') e.preventDefault();
      snackText.textContent = el.dataset.message;
      snackbar.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => snackbar.classList.remove('show'), 3000);
    });
  });
</script>
